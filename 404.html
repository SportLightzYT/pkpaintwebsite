<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 - ไม่พบหน้าที่ค้นหา | PK Paint &amp; Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 40px 20px; }
        .error-page h1 { font-size: 80px; font-weight: 800; color: #1e90ff; line-height: 1; margin-bottom: 10px; }
        .error-page h2 { font-size: 24px; font-weight: 600; color: #333; margin-bottom: 16px; }
        .error-page p { color: #777; font-size: 15px; max-width: 450px; margin-bottom: 30px; line-height: 1.7; }
        .error-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .error-actions a { padding: 12px 32px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; transition: all 0.3s; }
        .btn-home { background: #1e90ff; color: #fff; }
        .btn-home:hover { background: #1a7de6; transform: translateY(-2px); }
        .btn-contact-err { background: #f2f2f2; color: #555; }
        .btn-contact-err:hover { background: #e0e0e0; transform: translateY(-2px); }
        @media (max-width: 480px) {
            .error-page h1 { font-size: 56px; }
            .error-page h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1>404</h1>
        <h2>ไม่พบหน้าที่คุณค้นหา</h2>
        <p>หน้าที่คุณกำลังมองหาอาจถูกลบ เปลี่ยนชื่อ หรือไม่สามารถใช้งานได้ชั่วคราว</p>
        <div class="error-actions">
            <a href="index.html" class="btn-home"><i class="fas fa-home" style="margin-right:8px;"></i>กลับหน้าแรก</a>
            <a href="contact.html" class="btn-contact-err"><i class="fas fa-phone-alt" style="margin-right:8px;"></i>ติดต่อเรา</a>
        </div>
    </div>
</body>
</html>
